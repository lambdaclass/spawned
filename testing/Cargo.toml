[package]
name = "spawned-test"
description = "Test kit for Spawned actors: mocks, probes, harness helpers and fault injection"
readme = "README.md"
keywords = ["actors", "testing", "concurrency", "async"]
categories = ["development-tools::testing", "concurrency"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Path dependency (not `workspace = true`) so `--no-default-features` really
# drops the async runtime: the workspace entry keeps spawned-concurrency's defaults.
spawned-concurrency = { path = "../concurrency", version = "0.7.1", default-features = false }
spawned-rt = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }

[features]
default = ["async"]
# `tasks` mode helpers and ActorSystem/supervision helpers. Without it the crate builds Tokio-free with the `threads` helpers.
async = ["spawned-concurrency/async", "spawned-rt/async"]
