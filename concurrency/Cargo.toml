[package]
name = "spawned-concurrency"
description = "Spawned Concurrency"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
monoio = { version = "0.2.4", optional = true, default-features = false, features = ["legacy", "iouring", "sync"] }
spawned-rt = { workspace = true }
spawned-macros = { workspace = true }
tracing = { workspace = true }
futures = "0.3.1"
thiserror = "2.0.12"
pin-project-lite = "0.2"

[dev-dependencies]
# This tokio imports are only used in tests, we should not use them in the library code.
tokio-stream = { version = "0.1.17" }
tokio = { version = "1", features = ["full"] }
proptest = { version = "1", default-features = false, features = ["std"] }
trybuild = "1"

[[bench]]
name = "baseline"
harness = false

[features]
io-experiments = ["dep:monoio"]
# Private benchmark prototypes; no stable runtime-selection API.
backend-experiments = ["spawned-rt/backend-experiments"]
profiling-experiments = ["dep:pprof"]

[[bench]]
name = "designs"
harness = false
required-features = ["backend-experiments"]

[[bench]]
name = "io_designs"
harness = false
required-features = ["io-experiments"]

[[bench]]
name = "workload_research"
harness = false
required-features = ["backend-experiments"]

[target.'cfg(target_os = "linux")'.dependencies]
pprof = { version = "0.15", optional = true, features = ["flamegraph"] }

[target.'cfg(spawned_scheduler_loom)'.dev-dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(spawned_scheduler_loom)'] }

[[bench]]
name = "lifecycle_soak"
harness = false
required-features = ["backend-experiments"]

[[bench]]
name = "pinned_pipeline"
harness = false
required-features = ["backend-experiments"]
