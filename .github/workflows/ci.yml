name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - name: Build
        run: cargo build --verbose

  test:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run Tests
        run: cargo test --locked --verbose
      - name: Run capability examples
        run: |
          for example in execution_groups execution_profiles supervision_recovery supervision_tree dedicated_thread runtime_isolation byte_budget_pipeline timeout_outcomes graceful_drain protocol_timeouts streams_and_recipients registrations_and_fakes native_lifecycle coordinated_shutdown test_kit exit_signals; do
            timeout 60s cargo run --locked -p spawned-capability-examples --bin "$example"
          done
          timeout 60s cargo run --locked -p spawned-capability-examples --features metrics --bin framework_metrics
      - name: Test optional framework metrics
        run: cargo test --locked -p spawned-concurrency --features metrics
      - name: Parse Prometheus exposition and check canary diagnostics
        run: |
          set -o pipefail
          python3 -m venv /tmp/spawned-prometheus-parser
          /tmp/spawned-prometheus-parser/bin/pip install prometheus-client==0.21.1
          timeout 60s cargo run --locked -q -p spawned-capability-examples --features metrics --bin framework_metrics | timeout 60s /tmp/spawned-prometheus-parser/bin/python scripts/check-metrics-exposition.py
          cargo test --locked -p spawned-concurrency --features diagnostics,metrics --test canary_feedback --test context_exit
          timeout 60s cargo run --locked -p spawned-capability-examples --features diagnostics --bin shutdown_diagnostics

  # Single-CPU scheduling: races that need preemption on one core, and code
  # that silently assumes parallel progress. Tests that build their own
  # runtimes keep their explicit worker counts; taskset still confines every
  # worker to CPU 0. Tests that need two CPUs skip themselves (see
  # docs/TESTING.md, "Single-CPU runs").
  single-cpu:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: single-cpu
      - name: Build tests (all CPUs)
        run: cargo test --locked --workspace --no-run
      - name: Concurrency suite, one Tokio worker, CPU 0 only
        env:
          TOKIO_WORKER_THREADS: '1'
        run: taskset -c 0 cargo test --locked -p spawned-concurrency
      - name: Workspace tests, CPU 0 only
        run: taskset -c 0 cargo test --locked --workspace

  # Deterministic simulator (docs/TESTING.md, "Simulated suites in CI"):
  # every integration test of spawned-concurrency and spawned-rt, plus
  # spawned-rt's simulator unit tests and the deterministic_simulation
  # example, built with --cfg spawned_sim and run one test per process
  # with a per-test timeout, four at a time. Failing seeds leave decision
  # tapes, uploaded as an artifact.
  sim:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    env:
      RUSTFLAGS: --cfg spawned_sim --cfg tokio_unstable
      SPAWNED_SIM_TAPE_DIR: ${{ github.workspace }}/sim-tapes
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: sim
      - name: Deadline service stays in its owner's clock domain
        run: cargo test --locked -p spawned-concurrency --lib reply::registry::tests::deadline_service_ -- --test-threads=1
      - name: Simulated suites, one test per process
        run: python3 scripts/run-sim-tests.py -p spawned-concurrency -p spawned-rt:lib --jobs 4 --timeout 120
      - name: Simulated example test (deterministic_simulation)
        run: python3 scripts/run-sim-tests.py -p spawned-capability-examples --test deterministic_simulation --jobs 4 --timeout 120
      - name: Upload decision tapes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sim-tapes
          path: sim-tapes
          if-no-files-found: ignore

  # Semantics guarantee P2 (docs/design/semantics.md): with panic = "abort" a
  # panicking handler aborts the process (no stopped(), no reply), while
  # supervision of Kill/Shutdown exits still works. Test harnesses always
  # unwind, so the check is an example that runs each scenario in a subprocess.
  panic-abort:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: panic-abort
      - name: Handler panics abort; supervision of non-panic exits still works
        run: cargo run --locked -p spawned-concurrency --example panic_abort --profile panic-abort
      # ROADMAP rank 6b: `#[actor]` warns once per crate built with
      # panic = "abort" (chat_room has two actors, so exactly one warning).
      - name: '#[actor] warns once per crate under panic = "abort"'
        run: |
          out=$(cargo build --locked -p chat_room --profile panic-abort 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          test "$(grep -c 'PanicAbortInActorCrate' <<<"$out")" = 1

  # Advisories, licenses, duplicate versions and sources (deny.toml), plus
  # cargo-audit (.cargo/audit.toml). Accepted advisories are documented in both.
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - name: cargo deny
        run: cargo deny --all-features check
      - name: cargo audit
        run: cargo audit

  thread-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Native feature matrix
        run: |
          cargo test --locked -p spawned-rt --no-default-features
          cargo test --locked -p spawned-concurrency --no-default-features
          cargo test --locked -p spawned-test --no-default-features
          cargo test --locked -p spawned-concurrency --no-default-features --features threads,metrics
          cargo clippy --locked -p spawned-rt -p spawned-concurrency -p spawned-test --no-default-features --all-targets -- -D warnings
          cargo clippy --locked -p spawned-rt -p spawned-concurrency -p spawned-test --no-default-features --features spawned-concurrency/metrics --all-targets -- -D warnings
          cargo run --locked --manifest-path examples/thread_only/Cargo.toml --features metrics,async
          python3 scripts/check-thread-only.py
          cargo clippy --locked --manifest-path examples/thread_only/Cargo.toml --features metrics,async -- -D warnings
      - name: Check native integration tests remain enabled
        run: |
          cargo test --locked -p spawned-concurrency --no-default-features --tests -- --list > native-test-list.txt
          python3 scripts/check-native-test-list.py native-test-list.txt
      - name: Native documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked -p spawned-concurrency --no-default-features --features threads,metrics --no-deps

  fmt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - name: Run cargo fmt
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path examples/thread_only/Cargo.toml -- --check

  feature-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/feature-check/build"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack@0.6.46
      - name: Check each library feature without dev-dependency unification
        run: |
          python3 -m unittest discover -s scripts/tests
          python3 scripts/check-api.py features

  api-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Compare default, metrics and migrated APIs; audit declared feature-split breaks
        # Pin the rustdoc JSON producer together with semver-checks.
        run: >
          nix shell
          github:NixOS/nixpkgs/f4a03c008967841f2a0b3cb7c436fc6fc31671f6#cargo-semver-checks
          github:NixOS/nixpkgs/f4a03c008967841f2a0b3cb7c436fc6fc31671f6#rustc
          github:NixOS/nixpkgs/f4a03c008967841f2a0b3cb7c436fc6fc31671f6#cargo
          --command python3 scripts/check-api.py semver

  clippy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run Clippy
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --workspace --all-targets --features spawned-concurrency/metrics -- -D warnings

  publish-dry-run:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify crate packaging
        run: |
          # --no-verify packages leaf crates without fetching sibling versions.
          # spawned-concurrency's new sibling versions are published in dependency
          # order by release.yaml; its package is also validated before release.
          cargo package --package spawned-macros --no-verify
          # spawned-sim-libc (the simulator's interposers) ships with spawned-rt.
          cargo package --package spawned-sim-libc --package spawned-rt --no-verify

      - name: Verify spawned-test publication against unreleased siblings
        run: |
          # Match the release dependency order without publishing from a PR.
          cargo publish --package spawned-test --dry-run \
            --config "patch.crates-io.spawned-concurrency.path=\"$PWD/concurrency\"" \
            --config "patch.crates-io.spawned-rt.path=\"$PWD/rt\"" \
            --config "patch.crates-io.spawned-macros.path=\"$PWD/macros\""
