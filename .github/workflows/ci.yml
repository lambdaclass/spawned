name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - name: Build
        run: cargo build --verbose

  test:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run Tests
        run: cargo test --locked --verbose
      - name: Run capability examples
        run: |
          for example in dedicated_thread runtime_isolation byte_budget_pipeline timeout_outcomes graceful_drain; do
            timeout 60s cargo run --locked -p spawned-capability-examples --bin "$example"
          done
          timeout 60s cargo run --locked -p spawned-capability-examples --features metrics --bin framework_metrics
      - name: Test optional framework metrics
        run: cargo test --locked -p spawned-concurrency --features metrics

  fmt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - name: Run cargo fmt
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run Clippy
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --workspace --all-targets --features spawned-concurrency/metrics -- -D warnings

  publish-dry-run:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify crate packaging
        run: |
          # --no-verify packages leaf crates without fetching sibling versions.
          # spawned-concurrency's new sibling versions are published in dependency
          # order by release.yaml; its package is also validated before release.
          cargo package --package spawned-macros --no-verify
          cargo package --package spawned-rt --no-verify
