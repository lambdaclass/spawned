name: Kani

# Bounded model checking of the supervisor's pure arithmetic
# (concurrency/src/kani_proofs.rs; see docs/TESTING.md).
on:
  pull_request:
    branches: ["main"]
    paths:
      - "concurrency/src/**"
      - "concurrency/Cargo.toml"
      - ".github/workflows/kani.yml"
  push:
    branches: ["main"]
    paths:
      - "concurrency/src/**"
      - "concurrency/Cargo.toml"
      - ".github/workflows/kani.yml"
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: kani-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # v1.1, pinned by commit; Kani itself pinned to the version the proofs
      # were last run with.
      - uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f
        with:
          kani-version: '0.68.0'
          working-directory: concurrency
          args: '-p spawned-concurrency --output-format terse'
