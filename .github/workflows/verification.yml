name: Verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # TLA+ models (verification/tla), checked with TLC from the flake. The
  # per-PR configurations are split into parallel legs; `tla` below is the
  # required check and passes only if every leg (and, weekly, every deep
  # configuration) passed. Every configuration not named by a leg runs in
  # `other`, so a new MC*.cfg is checked without editing this list.
  tla-models:
    name: tla-models (${{ matrix.leg }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: supervision
            select: --only MCSupervision
          - leg: lifecycle
            select: --only 'MCLifecycle*'
          - leg: deferred
            select: --only 'MCDeferred*'
          - leg: start
            select: --only 'MCStart*'
          - leg: other
            select: --exclude 'MCSupervision,MCLifecycle*,MCDeferred*,MCStart*'
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Model-check
        run: nix run .#check-tla -- ${{ matrix.select }}

  # Supervisor lifecycle traces recorded from real runs, validated against the
  # models, plus the negative controls (invalid traces and model mutations
  # that must fail) and trace coverage.
  tla-traces:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      - name: Record supervisor lifecycle traces
        env:
          LIFECYCLE_TRACE_DIR: ${{ github.workspace }}/lifecycle-traces
        run: cargo test --locked -p spawned-concurrency --features lifecycle-trace,failpoints --test supervision_trace --test cohort_trace --test tree_trace --test nested_supervision --test coverage_trace --test job_trace --test reply_trace --test lifecycle_trace
      - name: Validate traces and negative controls
        run: nix run .#check-tla -- --traces-only lifecycle-traces --negative-controls
      # Which model actions, projected states and transitions the recorded
      # traces reach (verification/tla/README.md#trace-coverage). Report only,
      # except that an action covered in coverage-baseline.json must stay
      # covered. The model side comes from coverage-model.json.gz unless the
      # Supervision, Cohorts or Nested specs changed, in which case it is
      # recomputed (several minutes; commit the rewritten cache).
      - name: Trace coverage of the models
        run: >
          nix develop -c python3 verification/tla/trace_coverage.py
          --traces dedicated=lifecycle-traces
          --model-keys verification/tla/coverage-model.json.gz
          --baseline verification/tla/coverage-baseline.json
      # Weekly: every test binary of spawned-concurrency dumps each finished
      # supervisor's traces (LIFECYCLE_TRACE_ALL); report the combined coverage.
      - name: Record traces from the whole test suite
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          LIFECYCLE_TRACE_ALL: ${{ github.workspace }}/all-traces
          LIFECYCLE_TRACE_DIR: ${{ github.workspace }}/all-traces-dedicated
        run: cargo test --locked -p spawned-concurrency --features lifecycle-trace,failpoints --no-fail-fast || true
      - name: Trace coverage including the whole test suite
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: >
          nix develop -c python3 verification/tla/trace_coverage.py
          --traces dedicated=lifecycle-traces --traces whole-suite=all-traces
          --model-keys verification/tla/coverage-model.json.gz
          --json trace-coverage.json --top 40
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        with:
          name: trace-coverage
          path: trace-coverage.json

  # Weekly and on dispatch: the deep configurations (*Deep.cfg), one runner
  # each. MCLifecycleWideDeep is the former per-PR MCLifecycle (43M states).
  tla-deep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        config:
          - MCSupervisionDeep
          - MCDeferredRepliesDeep
          - MCDeferredJobsDeep
          - MCLifecycleWideDeep
          - MCLifecycleLiveDeep
          - MCLifecycleDeep
          - MCStartDeep
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Model-check ${{ matrix.config }}
        run: nix run .#check-tla -- --deep --only ${{ matrix.config }}

  # The required check: green only if every TLA+ job above passed (tla-deep
  # is skipped outside schedule/dispatch).
  tla:
    if: always()
    needs: [tla-models, tla-traces, tla-deep]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every TLA+ job passed
        env:
          MODELS: ${{ needs.tla-models.result }}
          TRACES: ${{ needs.tla-traces.result }}
          DEEP: ${{ needs.tla-deep.result }}
        run: |
          echo "tla-models: $MODELS, tla-traces: $TRACES, tla-deep: $DEEP"
          [[ "$MODELS" == success && "$TRACES" == success ]]
          [[ "$DEEP" == success || "$DEEP" == skipped ]]

  # Inductive invariants of the same models with Apalache (verification/tla/
  # apalache.sh): Init => IndInv, IndInv /\ Next => IndInv' over every state
  # of the configured size, plus guard-removal negative controls. About
  # 5 minutes on a GitHub runner; the larger Supervision and Coordinator
  # instances add about 1.5 minutes (job about 7 minutes in all).
  tla-apalache:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Inductive invariants and negative controls
        run: nix run .#check-apalache -- --negative-controls
      - name: Supervision with 10 children and max_restarts 10
        run: nix run .#check-apalache -- --model Supervision --size 10 10
      - name: Shutdown coordinator with 32 targets
        run: nix run .#check-apalache -- --model Coordinator --targets 32

  mailbox-loom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: mailbox-loom
      - name: Model-check the production mailbox admission algorithm
        env:
          RUSTFLAGS: --cfg spawned_scheduler_loom
        run: cargo test --locked -p spawned-concurrency --no-default-features --test mailbox_admission_loom
      - name: Model-check the reply slot, job core, link table and monitor fence
        env:
          RUSTFLAGS: --cfg spawned_scheduler_loom
        run: cargo test --locked --release -p spawned-concurrency --no-default-features --test reply_slot_loom --test registry_turn_loom --test job_core_loom --test link_fence_loom

  # Data races in the runtime and its dependencies. The crates forbid
  # unsafe code, so ThreadSanitizer is the sanitizer that matters here.
  tsan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: tsan
      - name: Lifecycle tests under ThreadSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=thread
          RUSTDOCFLAGS: -Zsanitizer=thread
          TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1
          PROPTEST_CASES: '8'
        run: >
          cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu
          -p spawned-concurrency --lib
          --test supervision --test supervision_strategies --test nested_supervision
          --test supervisor_policies
          --test execution_groups --test execution_profiles --test shutdown_publication
          --test resource_cleanup --test linked_exit_macro
          --test mailbox_drop_panic --test native_mailbox_drop --test startup_admission

  # Leaks after shutdown: LeakSanitizer reports heap allocations that are
  # unreachable at process exit (e.g. reference cycles between actor handles).
  # Same nightly/build-std setup as tsan. concurrency/tests/leaks.rs adds
  # explicit Weak/TLS/task-count assertions for what is observable in-process.
  lsan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: lsan
      - name: Lifecycle and leak tests under LeakSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=leak
          RUSTDOCFLAGS: -Zsanitizer=leak
          LSAN_OPTIONS: report_objects=1
          PROPTEST_CASES: '8'
        run: >
          cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu
          -p spawned-concurrency --lib
          --test supervision --test supervision_strategies --test nested_supervision
          --test supervisor_policies
          --test execution_groups --test execution_profiles --test shutdown_publication
          --test resource_cleanup --test linked_exit_macro --test leaks

  # Weekly mutation testing of the supervision and execution-group code.
  mutants:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Mutate supervision and system code
        run: >
          cargo mutants -p spawned-concurrency
          -f concurrency/src/supervision.rs -f concurrency/src/supervision/nested.rs
          -f concurrency/src/system.rs -f concurrency/src/system/group.rs
          -j 2 --timeout 120 || true
      - uses: actions/upload-artifact@v4
        with:
          name: mutants
          path: mutants.out
