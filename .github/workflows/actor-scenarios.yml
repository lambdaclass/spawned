name: Extended actor scenarios

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROPTEST_CASES: '1000'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p spawned-concurrency --test actor_scenarios
      - run: cargo test --locked -p spawned-concurrency --test actor_scenarios sustained_actor_churn -- --ignored
        env:
          SPAWNED_STRESS_ROUNDS: '100'
      - name: Controlled failures and independent histories
        run: |
          set -o pipefail
          cargo test --locked -p spawned-concurrency --test failure_windows --test request_histories --test delivery_simulation --test process_failures -- --nocapture 2>&1 | tee reliability-tests.log
        env:
          SPAWNED_FAILURE_REPORT: failure-coverage.txt
          SPAWNED_HISTORY_CASES: '128'
          SPAWNED_SIM_CASES: '256'
      - name: Bounded unique-payload pressure
        run: |
          set -o pipefail
          cargo test --locked -p spawned-concurrency --test payload_stress -- --ignored --nocapture 2>&1 | tee payload-stress.log
        env:
          SPAWNED_STRESS_PRODUCERS: '128'
          SPAWNED_STRESS_MESSAGES: '256'
          SPAWNED_STRESS_PAYLOAD: '1024'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actor-reliability-evidence
          path: |
            failure-coverage.txt
            reliability-tests.log
            payload-stress.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: actor-scenario-regressions
          path: concurrency/tests/*.proptest-regressions
          if-no-files-found: ignore

  cancellation-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: loom
      - run: cargo test --locked -p spawned-rt --test cancellation_loom
        env:
          RUSTFLAGS: '--cfg spawned_loom'
