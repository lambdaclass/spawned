# cargo-nextest profiles. Ordinary CI uses `cargo test`; this file only
# configures the nightly flaky-test tracking job
# (.github/workflows/actor-scenarios.yml, docs/TESTING.md "Flaky tests").

[profile.flaky]
# A test that fails and then passes on retry is reported as FLAKY in the
# JUnit report (<flakyFailure>); scripts/flaky-report.py fails the job on it,
# so a retry never turns a flaky test into a silent pass.
retries = 2
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.flaky.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true
