[package]
name = "spawned-capability-examples"
version = "0.1.0"
edition = "2021"
publish = false

[features]
metrics = ["spawned-concurrency/metrics"]
diagnostics = ["spawned-concurrency/diagnostics"]

[dependencies]
futures = "0.3.1"
spawned-concurrency = { workspace = true }
spawned-rt = { workspace = true, features = ["async", "fmt-subscriber"] }
spawned-test = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
spawned-protocol-contract = { path = "../protocol_contract" }

[[bin]]
name = "framework_metrics"
required-features = ["metrics"]

[[bin]]
name = "shutdown_diagnostics"
required-features = ["diagnostics"]

[lints.rust]
# Manual `impl Actor` `started()` methods return `()` or an `Init`, refining
# the trait's `impl Into<Init<Self>>` (`#[started]` adds this allow itself).
refining_impl_trait = { level = "allow", priority = -1 }
