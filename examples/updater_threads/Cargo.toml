[package]
name = "updater_threads"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
spawned-rt = { workspace = true, features = ["async"] }
spawned-concurrency = { workspace = true }
tracing = { workspace = true }
reqwest = { version = "0.12", features = ["blocking"] }

[[bin]]
name = "updater_threads"
path = "src/main.rs"