[workspace]
resolver = "3"

members = [
    "rt",
    "concurrency",
    "macros",
    "testing",
    "sim-libc",
    "examples/bank",
    "examples/name_server",
    "examples/ping_pong",
    "examples/updater",
    "examples/signal_test",
    "examples/chat_room",
    "examples/service_discovery",
    "examples/capabilities",
    "examples/protocol_contract",
]

[workspace.dependencies]
spawned-rt = { path = "rt", version = "0.8.0", default-features = false }
spawned-concurrency = { path = "concurrency", version = "0.8.0" }
spawned-macros = { path = "macros", version = "0.8.0" }
spawned-test = { path = "testing", version = "0.8.0" }
tracing = { version = "0.1.41", features = ["log"] }
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

[workspace.package]
version = "0.8.0"
license = "MIT"
edition = "2021"
repository = "https://github.com/lambdaclass/spawned"

# Builds the `panic_abort` example (semantics guarantee P2). Test harnesses
# always unwind, so that check is an example binary run in CI.
[profile.panic-abort]
inherits = "dev"
panic = "abort"

# Simulator builds (`cargo sim-test`, .cargo/config.toml): the dev profile in
# its own directory, target/sim, so the --cfg spawned_sim build does not
# evict the normal one.
[profile.sim]
inherits = "dev"
