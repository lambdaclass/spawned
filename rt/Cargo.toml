[package]
name = "spawned-rt"
description = "Spawned Runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tokio = { version = "1", optional = true, features = ["full"] }
tokio-util = { version = "0.7.15", optional = true }
tokio-stream = { version = "0.1.17", optional = true, features = ["sync"] }
ctrlc = "3.4"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

crossbeam-deque = { version = "=0.8.8", optional = true }
async-task = { version = "=4.7.1", optional = true }

[lib]
path = "./src/lib.rs"

[target.'cfg(spawned_loom)'.dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(spawned_loom)'] }

[features]
default = ["async"]
async = ["dep:tokio", "dep:tokio-util", "dep:tokio-stream", "dep:nix"]
backend-experiments = ["async", "dep:async-task", "dep:crossbeam-deque"]

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.30.1", features = ["sched"], optional = true }
