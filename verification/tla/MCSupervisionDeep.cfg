\* Deep configuration: three children, one per restart mode. Safety and
\* action properties only (liveness at this size is slow). Run with
\* `nix run .#check-tla -- --deep`.
SPECIFICATION Spec
CONSTANTS
    N = 3
    MaxRestarts = 2
    MaxGen = 2
    Mode <- MCMode
CONSTRAINT GenBound
INVARIANT Safety
PROPERTIES
    NoStartAfterClose
    RestartFollowsPolicy
    ReverseShutdown
    NeverReopens
