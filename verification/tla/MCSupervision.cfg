\* Fast configuration for CI: two children (Permanent, Transient),
\* safety, action properties and liveness.
SPECIFICATION Spec
CONSTANTS
    N = 2
    MaxRestarts = 2
    MaxGen = 3
    Mode <- MCMode2
CONSTRAINT GenBound
INVARIANT Safety
PROPERTIES
    NoStartAfterClose
    RestartFollowsPolicy
    ReverseShutdown
    NeverReopens
    ClosedLeadsToDone
