\* At the cap (CI, every PR): one worker, the first caller's waker blocks.
\* A later wake-up may wait only while every worker is stuck.
SPECIFICATION FairSpec
INVARIANT SafetyCapped
PROPERTY EveryDueExpires
CONSTANTS
    N = 2
    P = 0
    O = 0
    MaxTime = 2
    Workers = 1
    InitIdle = {}
    Blocking <- MCBlocking
    Fault = "None"
