\* unkeyed jobs, two permits, one instance, one emit per job, one credit.
\* Checks that a held result keeps its credit and its armed deadline.
SPECIFICATION FairSpec
INVARIANT Safety
PROPERTY JobReported
CONSTANTS
    J = 3
    Keyed = {}
    JobBound = 2
    MaxGen = 1
    MaxEmit = 1
    Credits = 1
    Fault = "None"
