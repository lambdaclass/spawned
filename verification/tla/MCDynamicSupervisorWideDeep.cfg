\* Weekly (--deep): the broad instance, two terminate calls (by id and by slot
\* fenced with expect, both naming any generation seen), budget 1, no backoff,
\* every outcome. 52.1M states, 15m22s on fede: too slow per PR. The safety
\* negative controls run here (a counterexample is found in seconds whatever
\* the instance size).
SPECIFICATION Spec
CONSTANTS
    N = 2
    ModeSet = {"Permanent", "Transient", "Temporary"}
    MaxChildren = 1
    MaxRestarts = 1
    MaxExpire = 1
    SelfExits = {"Normal", "Panic"}
    StartFails = {"none", "Normal"}
    CleanupFails = {FALSE, TRUE}
    TermCalls <- MCCalls2
    CallSlot <- MCCallSlot2
    CallKind <- MCCallKind2
    BackoffOn = FALSE
    StartDeadlines = TRUE
    FanoutSteps = FALSE
    Fault = "None"
INVARIANT TypeOK
INVARIANT AtMostOneGeneration
INVARIANT PublishedIsLive
INVARIANT NoChildOutlivesSupervisor
INVARIANT MaxChildrenBound
INVARIANT SerialConstruction
INVARIANT FifoOrder
INVARIANT TemporaryNeverRestarted
INVARIANT TerminatedNeverRestarted
INVARIANT NoGenerationAfterClose
INVARIANT NoPublishAfterStop
INVARIANT NoStartAfterShutdown
INVARIANT RestartFollowsPolicy
INVARIANT FirstStartNeverRetried
INVARIANT FailedAfterCleanup
INVARIANT FailureCauseKept
INVARIANT ChargedRestarts
INVARIANT ReservationsMatch
INVARIANT BudgetBounded
INVARIANT ExhaustionCloses
INVARIANT StuckIsolated
INVARIANT ConcurrentShutdown
INVARIANT OkMeansReady
INVARIANT TermResultsSound
INVARIANT RemovedAfterFinalize
INVARIANT QueuedTermStopped
PROPERTY NeverReopens
PROPERTY TermResultStable
