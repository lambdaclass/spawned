\* Small per-PR configuration with a Temporary child next to a Permanent one:
\* makes TemporaryStartsOnce (in Safety) and the Temporary rows of
\* RestartFollowsPolicy non-vacuous. Safety and action properties only.
\* negative_checks.py mutates Restarts so a Temporary child restarts after a
\* panic and requires TemporaryStartsOnce to fail here.
SPECIFICATION Spec
CONSTANTS
    N = 2
    MaxRestarts = 2
    MaxGen = 2
    Mode <- MCModeTemp
CONSTRAINT GenBound
INVARIANT Safety
PROPERTIES
    NoStartAfterClose
    RestartFollowsPolicy
    ReverseShutdown
    NeverReopens
