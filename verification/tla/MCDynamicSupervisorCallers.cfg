\* Per PR: as MCDynamicSupervisorCallersDeep with two restart types
\* (Permanent, Temporary) instead of three.
SPECIFICATION CallerSpec
CONSTANTS
    N = 2
    ModeSet = {"Permanent", "Temporary"}
    MaxChildren = 2
    MaxRestarts = 1
    MaxExpire = 1
    SelfExits = {"Normal", "Panic"}
    StartFails = {"none"}
    CleanupFails = {FALSE}
    TermCalls <- MCCalls1
    CallSlot <- MCCallSlot1
    CallKind <- MCCallKind1
    BackoffOn = FALSE
    StartDeadlines = TRUE
    FanoutSteps = TRUE
    Fault = "None"
INVARIANT TypeOK
PROPERTY StartAnswered
PROPERTY TerminateAnswered
PROPERTY FanoutCompletes
