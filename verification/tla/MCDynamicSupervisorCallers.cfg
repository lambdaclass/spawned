\* Per PR, liveness under CallerSpec (no user cleanup ever assumed to
\* finish, only deadlines fire): every start_child and terminate_child is
\* answered, and the fan-out, as separate steps (refinement of the atomic
\* SupSignal), signals every admitted child even if siblings never finish.
SPECIFICATION CallerSpec
CONSTANTS
    N = 2
    ModeSet = {"Permanent", "Transient", "Temporary"}
    MaxChildren = 2
    MaxRestarts = 1
    MaxExpire = 1
    SelfExits = {"Normal", "Panic"}
    StartFails = {"none"}
    CleanupFails = {FALSE}
    TermCalls <- MCCalls1
    CallSlot <- MCCallSlot1
    CallKind <- MCCallKind1
    BackoffOn = FALSE
    StartDeadlines = TRUE
    FanoutSteps = TRUE
    Fault = "None"
INVARIANT TypeOK
PROPERTY StartAnswered
PROPERTY TerminateAnswered
PROPERTY FanoutCompletes
