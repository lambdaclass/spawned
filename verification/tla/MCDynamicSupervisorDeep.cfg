\* Deep instance (weekly, --deep): four start_child calls against
\* max_children 3, budget 2 with two window releases; safety and the action
\* property. Reasons are one per class: the model's decisions depend only on
\* Normal-class (Normal, Shutdown) versus abnormal (Panic, Kill, Killed), and
\* every startup failure takes the same path, so more reasons only multiply
\* states (every reason for every operation made this instance exceed 12 GB
\* of TLC state on fede without finishing).
SPECIFICATION Spec
CONSTANTS
    N = 4
    Mode <- MCMode4
    MaxChildren = 3
    MaxRestarts = 2
    MaxExpire = 2
    SelfExits = {"Normal", "Panic"}
    StartFails = {"none"}
    Fault = "None"
INVARIANT TypeOK
INVARIANT AtMostOneGeneration
INVARIANT PublishedIsLive
INVARIANT NoChildOutlivesSupervisor
INVARIANT MaxChildrenBound
INVARIANT TemporaryNeverRestarted
INVARIANT TerminatedNeverRestarted
INVARIANT NoStartAfterShutdown
INVARIANT NoGenerationAfterClose
INVARIANT ExhaustionCloses
INVARIANT BudgetBounded
INVARIANT ConcurrentShutdown
INVARIANT OkMeansReady
PROPERTY NeverReopens
