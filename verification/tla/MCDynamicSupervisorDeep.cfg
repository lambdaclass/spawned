\* Deep instance (weekly, --deep): the fast instance's three start_child
\* calls (Permanent, Transient, Temporary) with a deeper budget and window
\* (budget 2, two window releases, so up to four restarts) and both slots of
\* max_children 2 contested; safety and the action property. Reasons are
\* one per class: the decisions depend only on Normal-class (Normal,
\* Shutdown) versus abnormal (Panic, Kill, Killed). Four slots do not fit:
\* with one reason per class they passed 222M distinct states in 30 minutes
\* on fede without finishing.
SPECIFICATION Spec
CONSTANTS
    N = 3
    Mode <- MCMode3
    MaxChildren = 2
    MaxRestarts = 2
    MaxExpire = 2
    SelfExits = {"Normal", "Panic"}
    StartFails = {"none", "Panic"}
    Fault = "None"
INVARIANT TypeOK
INVARIANT AtMostOneGeneration
INVARIANT PublishedIsLive
INVARIANT NoChildOutlivesSupervisor
INVARIANT MaxChildrenBound
INVARIANT TemporaryNeverRestarted
INVARIANT TerminatedNeverRestarted
INVARIANT NoStartAfterShutdown
INVARIANT NoGenerationAfterClose
INVARIANT ExhaustionCloses
INVARIANT BudgetBounded
INVARIANT ConcurrentShutdown
INVARIANT OkMeansReady
PROPERTY NeverReopens
