INVARIANT AtMostOneGeneration
INVARIANT PublishedIsLive
INVARIANT NoChildOutlivesSupervisor
INVARIANT MaxChildrenBound
INVARIANT SerialConstruction
INVARIANT TemporaryNeverRestarted
INVARIANT TerminatedNeverRestarted
INVARIANT NoGenerationAfterClose
INVARIANT NoPublishAfterStop
INVARIANT NoStartAfterShutdown
INVARIANT RestartFollowsPolicy
INVARIANT FirstStartNeverRetried
INVARIANT FailedAfterCleanup
INVARIANT FailureCauseKept
INVARIANT ChargedRestarts
INVARIANT ReservationsMatch
INVARIANT BudgetBounded
INVARIANT ExhaustionCloses
INVARIANT StuckIsolated
INVARIANT ConcurrentShutdown
INVARIANT OkMeansReady
