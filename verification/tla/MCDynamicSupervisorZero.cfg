\* Per PR, zero budget: max_restarts 0, so the first restartable exit fails
\* the supervisor at once, without entering backoff.
SPECIFICATION Spec
CONSTANTS
    N = 2
    ModeSet = {"Permanent", "Transient", "Temporary"}
    SelfExits = {"Normal", "Panic"}
    StartFails = {"none", "Normal"}
    CleanupFails = {FALSE, TRUE}
    Fault = "None"
    MaxChildren = 1
    MaxRestarts = 0
    MaxExpire = 0
