\* Fast instance (CI, every PR): a blocking payload destructor; two requests,
\* two payloads, three workers, clock to 2.
SPECIFICATION FairSpec
INVARIANT Safety
PROPERTY EveryWakeRuns
PROPERTY EveryDueExpires
CONSTANTS
    N = 2
    P = 2
    MaxTime = 2
    Workers = 3
    Blocking <- MCBlocking
    Fault = "None"
