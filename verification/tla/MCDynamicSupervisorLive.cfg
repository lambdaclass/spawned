\* Per PR, liveness under Spec (cleanup eventually ends): shutdown
\* completes, recovery progresses. Backoff on, one terminate call.
SPECIFICATION Spec
CONSTANTS
    N = 2
    ModeSet = {"Permanent", "Transient", "Temporary"}
    MaxChildren = 1
    MaxRestarts = 1
    MaxExpire = 1
    SelfExits = {"Normal", "Panic"}
    StartFails = {"none"}
    CleanupFails = {FALSE}
    TermCalls <- MCCalls1
    CallSlot <- MCCallSlot1
    CallKind <- MCCallKind1
    BackoffOn = TRUE
    FanoutSteps = FALSE
    Fault = "None"
INVARIANT TypeOK
PROPERTY ClosedLeadsToDone
PROPERTY RecoveryProgress
