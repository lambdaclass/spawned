\* Per PR, liveness under CallerSpec without startup deadlines: once
\* shutdown begins every pending start is answered by its abort (and the
\* cleanup deadline), not by a startup timeout. Passes as is; the NoAbort
\* control must fail here. Small: one cap, no budget, no terminate calls.
SPECIFICATION CallerSpec
CONSTANTS
    N = 2
    ModeSet = {"Permanent", "Transient", "Temporary"}
    MaxChildren = 1
    MaxRestarts = 0
    MaxExpire = 0
    SelfExits = {"Normal", "Panic"}
    StartFails = {"none"}
    CleanupFails = {FALSE}
    TermCalls <- MCCalls0
    CallSlot <- MCCallSlot0
    CallKind <- MCCallKind0
    BackoffOn = FALSE
    StartDeadlines = FALSE
    FanoutSteps = FALSE
    Fault = "None"
INVARIANT TypeOK
PROPERTY ShutdownAnswersStarts
