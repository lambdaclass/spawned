\* Fast instance (CI, every PR): two requests and one payload of one owner,
\* three workers, clock to 2; the first caller's waker blocks forever.
SPECIFICATION FairSpec
INVARIANT Safety
PROPERTY EveryWakeRuns
PROPERTY EveryDueExpires
CONSTANTS
    N = 2
    P = 1
    O = 0
    MaxTime = 2
    Workers = 3
    InitIdle = {}
    Blocking <- MCBlocking
    Fault = "None"
