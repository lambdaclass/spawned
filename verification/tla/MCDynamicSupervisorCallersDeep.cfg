\* Weekly (--deep): liveness under CallerSpec (no user cleanup ever assumed
\* to finish, only deadlines fire), every pair of restart types: every
\* start_child and terminate_child is answered, and the fan-out, as separate
\* steps, signals every admitted child even if siblings never finish.
\* 11.7M states, 47 min on a loaded fede. The liveness controls run here.
SPECIFICATION CallerSpec
CONSTANTS
    N = 2
    ModeSet = {"Permanent", "Transient", "Temporary"}
    MaxChildren = 2
    MaxRestarts = 1
    MaxExpire = 1
    SelfExits = {"Normal", "Panic"}
    StartFails = {"none"}
    CleanupFails = {FALSE}
    TermCalls <- MCCalls1
    CallSlot <- MCCallSlot1
    CallKind <- MCCallKind1
    BackoffOn = FALSE
    StartDeadlines = TRUE
    FanoutSteps = TRUE
    Fault = "None"
INVARIANT TypeOK
PROPERTY StartAnswered
PROPERTY TerminateAnswered
PROPERTY FanoutCompletes
